name: Publish NuGet (Test)

on:
  workflow_dispatch:

jobs:
  publish-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ["8.0.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Inject test version
        run: |
          sh update-version.sh --check
          CURRENT_VERSION=$(cat VERSION)
          sh update-version.sh "${CURRENT_VERSION}-test.$GITHUB_RUN_NUMBER"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack --configuration Release --no-build --output ./nuget_packages

      - name: Push to NuGet.org
        run: dotnet nuget push "./nuget_packages/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate
